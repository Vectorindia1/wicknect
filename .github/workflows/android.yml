name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .
      - run: ./gradlew --no-daemon :core:test :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HostelAutoLogin-apk
          path: android/app/build/outputs/apk/release/*.apk
