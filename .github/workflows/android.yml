name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .
      - run: ./gradlew --no-daemon :core:test :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk HostelAutoLogin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HostelAutoLogin-apk
          path: android/HostelAutoLogin.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android APK build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "Debug-signed APK for personal use. Open this page on your phone and tap HostelAutoLogin.apk."
          files: android/HostelAutoLogin.apk
