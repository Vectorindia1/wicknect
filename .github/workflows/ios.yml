name: iOS IPA
on:
  workflow_dispatch:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project HostelAutoLogin.xcodeproj -scheme HostelAutoLogin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Wify.app Payload/
          zip -qr Wify-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Wify-ipa
          path: ios/Wify-unsigned.ipa
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS IPA build ${{ github.run_number }} (unsigned)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "Unsigned IPA. It must be signed on install: use Sideloadly or AltStore with your own Apple ID (see docs/USER_GUIDE.md, iPhone section)."
          files: ios/Wify-unsigned.ipa
