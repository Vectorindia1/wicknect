name: Windows EXE
on:
  workflow_dispatch:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows, shell: cmd } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: HostelAutoLogin-exe
          path: windows/dist/HostelAutoLogin.exe
