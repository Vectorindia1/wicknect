name: Windows EXE
on:
  workflow_dispatch:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows, shell: cmd } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Wify-exe
          path: windows/dist/Wify.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows EXE build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "Windows tray app. Download Wify.exe and double-click it."
          files: windows/dist/Wify.exe
